services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Login password for the runtime role `app_rw`. The role's privileges are
      # granted by each app's Prisma migration; only the dev password is set here.
      APP_RW_PASSWORD: ${APP_RW_PASSWORD:-app_rw_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-rw.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
